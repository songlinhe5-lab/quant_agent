# ==========================================
# Quant Agent - 北京 VPS 数据源子服务配置
# ==========================================
# 定位: 中国内地节点，提供 Tushare + AKShare HTTP API 服务
# 部署位置: 北京 VPS（内网 IP 访问中国大陆）
# 端口: 8010 (Tushare) + 8011 (AKShare)
# ==========================================

services:
  tushare-subservice:
    image: ghcr.io/songlinhe5-lab/quant-agent:latest
    pull_policy: missing
    container_name: quant_tushare_subservice
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8010 --workers 2 --loop uvloop --http httptools
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUANT_ENV=production
      # 关键：只安装 Tushare SDK，不安装其他数据源
      - DATASOURCE_TUSHARE_MODE=external
      - DS_BASE_URL=0.0.0.0:8010
      - TAILSCALE_IP=127.0.0.1
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
    volumes:
      - tushare_cache:/app/tushare_cache
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
    networks:
      - quant-internal
    ports:
      # 仅暴露 Tailscale 内网 IP（不对公网开放）
      - "${TAILSCALE_IP:-127.0.0.1}:8010:8010"

  akshare-subservice:
    image: ghcr.io/songlinhe5-lab/quant-agent:latest
    pull_policy: missing
    container_name: quant_akshare_subservice
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8011 --workers 4 --loop uvloop --http httptools
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUANT_ENV=production
      # 关键：只安装 AKShare SDK，不安装其他数据源
      - DATASOURCE_AKSHARE_MODE=external
      - DS_BASE_URL=0.0.0.0:8011
      - TAILSCALE_IP=127.0.0.1
    volumes:
      - akshare_cache:/app/akshare_cache
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.5'
        reservations:
          memory: 768M
    networks:
      - quant-internal
    ports:
      # 仅暴露 Tailscale 内网 IP（不对公网开放）
      - "${TAILSCALE_IP:-127.0.0.1}:8011:8011"

  # 共享 Redis 实例（所有子服务共用主节点的 Redis）
  # 注意：如果已有主节点的 Redis，这里可以注释掉
  redis:
    image: redis:7-alpine
    container_name: quant_redis_slave
    restart: always
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - slave_redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-quant_redis_secret_2026}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-quant_redis_secret_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - quant-internal

networks:
  quant-internal:
    driver: bridge

volumes:
  tushare_cache:
    name: quant_tushare_cache
  akshare_cache:
    name: quant_akshare_cache
  slave_redis_data:
    name: quant_slave_redis_data
