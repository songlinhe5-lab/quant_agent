name: Auto Deploy to VPS

on:
  push:
    branches:
      - main  # 当代码推送到 main 分支时触发

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 进入项目目录
            cd /opt/quant-agent
            
            # 拉取最新代码
            git pull origin main
            
            # 重新构建 backend 镜像
            docker-compose -f docker-compose.master.yml build --no-cache quant_app
            
            # 重启容器
            docker-compose -f docker-compose.master.yml up -d quant_app
            
            # 等待容器启动
            sleep 10
            
            # 健康检查
            echo "=== 健康检查 ==="
            curl -f http://localhost:8000/api/v1/health || exit 1
            
            # 检查 tushare 是否安装
            echo "=== 检查 tushare ==="
            docker exec quant_app python -c "import tushare; print(f'tushare 版本：{tushare.__version__}')" || echo "⚠️ tushare 未安装"
            
            # 显示容器状态
            echo "=== 容器状态 ==="
            docker ps | grep quant_app
            
            echo "✅ 部署完成！"
