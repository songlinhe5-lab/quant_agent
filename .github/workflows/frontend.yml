name: Frontend CI

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # ==========================================
  # Stage 1: CI Quality Gates
  # ==========================================
  # 分支保护由 GitHub Branch Protection Rules 处理
  # ==========================================
  test:
    name:  Test & Coverage
    runs-on: ubuntu-latest
    # 💡 只在 develop push 时运行（PR 不运行）
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        working-directory: ./frontend
        run: pnpm exec vitest run --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Compose 卫生校验 (复用 backend 的 reusable workflow) ──
  # frontend 若引入 docker-compose (如 e2e 测试)，在此传入自己的 compose 列表即可复用同一套校验。
  # fail-on-missing=false: 当前 frontend 尚未有 compose 文件，文件不存在时跳过而非失败 (占位接入点)。
  # 未来新增 compose 时把 fail-on-missing 改为 true 即可强制校验。
  compose-hygiene:
    name: 🛡️ Compose hygiene (frontend)
    uses: ./.github/workflows/compose-hygiene.yml
    with:
      compose-files: "docker-compose.e2e.yml"
      fail-on-missing: false

  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    needs: [test, compose-hygiene]
    # 💡 只在 develop push 时运行（PR 不运行）
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: ./frontend
        run: |
          pnpm run lint || true
          pnpm run type-check || true
      - name: Build
        working-directory: ./frontend
        run: NODE_OPTIONS='--max-old-space-size=4096' pnpm run build
      - name: 🔒 Mock 红线扫描 (§14.1 PROD 零 Mock)
        working-directory: ./frontend
        run: |
          echo "🔍 扫描未门控的 mock 数据导入 (src)..."
          violations=0
          for f in $(grep -rlE "MOCK_[A-Z_]+" src --include=*.ts --include=*.tsx); do
            if ! grep -q "MOCK_ENABLED" "$f"; then
              echo "::error file=$f::§14.1 违规：$f 使用了 MOCK_* 数据但未用 MOCK_ENABLED 门控"
              violations=1
            fi
          done
          if [ "$violations" -ne 0 ]; then
            echo "❌ 存在未门控的 mock 数据，PROD 零 Mock 红线失败"
            exit 1
          fi
          echo "✅ 未发现未门控的 mock 数据导入"
      - name: Security audit
        working-directory: ./frontend
        run: pnpm audit 2>&1 || true
        continue-on-error: true
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  deploy:
    name:  Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    # 💡 只在 main/master 推送时部署生产环境（PR 不部署）
    # 注意：main push 时 build 被跳过，所以接受 'success' 或 'skipped'
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not configured, skipping deploy"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.skip == 'false'
      - name: Install pnpm
        if: steps.check.outputs.skip == 'false'
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
      - name: Build
        if: steps.check.outputs.skip == 'false'
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: NODE_OPTIONS='--max-old-space-size=4096' pnpm run build
      - name: 🔒 Mock 红线扫描 (§14.1 PROD 零 Mock)
        if: steps.check.outputs.skip == 'false'
        working-directory: ./frontend
        run: |
          echo "🔍 扫描未门控的 mock 数据导入 (src)..."
          violations=0
          for f in $(grep -rlE "MOCK_[A-Z_]+" src --include=*.ts --include=*.tsx); do
            if ! grep -q "MOCK_ENABLED" "$f"; then
              echo "::error file=$f::§14.1 违规：$f 使用了 MOCK_* 数据但未用 MOCK_ENABLED 门控"
              violations=1
            fi
          done
          if [ "$violations" -ne 0 ]; then
            echo "❌ 存在未门控的 mock 数据，PROD 零 Mock 红线失败"
            exit 1
          fi
          echo "✅ 未发现未门控的 mock 数据导入"
      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.skip == 'false'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          projectName: quant-agent
          directory: frontend/dist
          branch: ${{ github.ref_name }}
