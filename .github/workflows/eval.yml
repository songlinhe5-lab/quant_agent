name: Agent Eval (Weekly)

on:
  schedule:
    - cron: '0 2 * * 1'  # 每周一 UTC 02:00
  workflow_dispatch:

env:
  UV_HTTP_TIMEOUT: 300

permissions:
  contents: read

jobs:
  eval:
    name: Agent Eval Framework
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          # 缓存 uv 下载与解析结果，跨 run 复用；lock 变更时自动失效
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      # 一次性预装依赖到 .venv。后续所有步骤用 `uv run --frozen`，
      # 直接复用该 .venv 且跳过依赖解析（--frozen = 不查改 uv.lock）。
      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run Eval Framework
        env:
          DATABASE_URL: "sqlite:///./test.db"
          EMBEDDING_API_KEY: "test-key"
          EMBEDDING_BASE_URL: "http://localhost:8080"
          LLM_API_KEY: "test-key"
          LLM_BASE_URL: "http://localhost:8080"
        run: |
          uv run --frozen --no-sync pytest backend/tests/test_eval_framework.py -v --tb=short 2>&1 | tee eval_report.txt

      - name: Run Golden Dataset Eval
        env:
          DATABASE_URL: "sqlite:///./test.db"
          EMBEDDING_API_KEY: "test-key"
          EMBEDDING_BASE_URL: "http://localhost:8080"
        run: |
          uv run --frozen --no-sync python -c "
          from backend.services.eval_runner import eval_runner
          report = eval_runner.run_all()
          import json
          print(json.dumps(report.to_dict(), indent=2, ensure_ascii=False))
          " > eval_results.json

      - name: Upload Eval Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-report
          path: |
            eval_report.txt
            eval_results.json
          retention-days: 30
