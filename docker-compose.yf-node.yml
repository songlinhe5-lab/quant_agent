# ==========================================
# Quant Agent - YFinance 子服务配置
# ==========================================
# 定位: 独立 HTTP API 子服务，提供 YFinance 行情数据
# 部署位置: 美国 VPS / 海外节点
# 端口: 8009 (内部访问)
# ==========================================

services:
  yfinance-subservice:
    image: ghcr.io/songlinhe5-lab/quant-agent:latest
    pull_policy: missing
    container_name: quant_yf_subservice
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8009 --workers 2 --loop uvloop --http httptools
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUANT_ENV=production
      # 关键：只安装 yfinance SDK，不安装其他数据源
      - DATASOURCE_YFINANCE_MODE=external
      - DS_BASE_URL=0.0.0.0:8009
      - TAILSCALE_IP=127.0.0.1
    volumes:
      - yf_cache:/app/yfinance_cache
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
    networks:
      - quant-internal
    ports:
      # 仅暴露 Tailscale 内网 IP（不对公网开放）
      - "${TAILSCALE_IP:-127.0.0.1}:8009:8009"

  # 共享 Redis 实例（所有子服务共用主节点的 Redis）
  # 注意：如果已有主节点的 Redis，这里可以注释掉
  redis:
    image: redis:7-alpine
    container_name: quant_redis_subservice
    restart: always
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - yf_redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-quant_redis_secret_2026}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-quant_redis_secret_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - quant-internal

networks:
  quant-internal:
    driver: bridge

volumes:
  yf_cache:
    name: quant_yf_cache
  yf_redis_data:
    name: quant_yf_redis_data
