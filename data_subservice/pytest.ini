# 数据子服务单测独立入口。
#
# 为什么独立: 本目录用例依赖 tushare / futu-api / akshare / yfinance 等重型 SDK，
# 这些 SDK 按架构规定禁止装在 backend 环境（backend/requirements.txt 明文禁止），
# 因此无法并入主工程 pyproject.toml 的 testpaths（会在 collection 阶段 import 失败
# 拖垮整轮 backend 单测）。
#
# 运行方式（必须在装有 data_subservice/requirements.txt 的环境里）:
#   cd data_subservice
#   pip install -r requirements.txt
#   pytest -c pytest.ini
#
# 配置与主工程保持一致（asyncio_mode=auto、markers、env、filterwarnings），
# 其 conftest.py 已把仓库根与 data_subservice 目录注入 sys.path，保证
# `import data_subservice.main` 与 `from _internal.tushare import service` 两类导入均可解析。

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short -p no:unraisableexception
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    no_mock_external: skip _mock_external_services fixture in conftest.py
    asyncio: mark test as async
asyncio_mode = auto
env =
    NUMBA_CACHE_DIR=/tmp/numba_cache
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
