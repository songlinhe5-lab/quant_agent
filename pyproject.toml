[project]
name = "quant-agent"
version = "0.1.0"
description = "Quant Agent - 资深量化交易架构师与自动化执行主脑"
requires-python = ">=3.11"
dependencies = [
    # Agent & LLM
    "openai>=1.14.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    # Quant & API (数据源 SDK 移到 optional-dependencies.datasource)
    "pandas>=2.0.0",
    "aiohttp>=3.9.0",
    "pyarrow>=15.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "pyrate-limiter>=3.0.0",
    "numba>=0.59.0",
    # Document Parsers
    "pdfplumber>=0.10.0",
    # API Backend
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "prometheus-client>=0.20.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.25",
    "greenlet>=3.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "bcrypt>=4.1.2",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "google-auth>=2.28.0",
    "requests>=2.31.0",
    # Search & NLP & Vector DB
    "duckduckgo-search>=5.0.0",
    "frozendict>=2.4.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "chromadb>=0.4.24",
    "langchain-text-splitters>=0.2.0",
    "pgvector>=0.4.2",
    "structlog>=26.1.0",
    "vectorbt>=0.28.2",
    # OpenTelemetry
    "opentelemetry-api>=1.0.0",
    "opentelemetry-sdk>=1.0.0",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-exporter-otlp-proto-http",
]

[project.optional-dependencies]
# 数据源 SDK（子服务节点安装，主节点走 HTTP 路由不安装）
# 全量子服务镜像：所有节点共用同一 data-subservice 镜像，节点能力由运行时
# DS_CAPABILITIES 环境变量隔离（未声明的能力返回 503），镜像不再按地域拆分。
# 实测三个地域镜像尺寸差异仅 2~4%（407.8~424.6MB），拆分的体积收益可忽略，
# 反而增加 CI 矩阵复杂度（串行 push 防 GHCR 限流），故合并为单一 datasource-all。
# 基础依赖已含 websockets>=12.0，Finnhub 长连接无需额外声明。
datasource-all = [
    "yfinance",                # 美股/加密/外汇
    "tushare>=1.4.0",          # A 股
    "akshare>=1.1.15",         # 沪深港通
    # futu-api 仅子服务镜像使用: backend/services/futu 已改造为纯 HTTP 透传 facade
    # (BE-ARCH-09), 主服务运行时绝不 import futu, 经 DataSourceRouter 转发至
    # data_subservice/futu_src。请勿在主服务默认环境安装此包。
    "futu-api>=10.10.0",        # 港股/富途 (仅 data_subservice, 主服务走 HTTP 代理)
    "finnhub-python>=2.4.29",  # Finnhub REST+WebSocket (长连接实时流)
    "baostock>=0.8.9",         # A股历史K线/季频财务/复权因子 (T+1, 免费协议源)
    "mootdx>=0.11.0",         # 通达信协议: 盘中快照/分时/分钟线 (免费, 同步 socket; 核心依赖 tdxpy 在 base, 无需 [all] extra)
]
# 本地向量化模型（可选，默认用 API 替代）
local-embedding = [
    "sentence-transformers>=2.5.0",
]
# Prompt 热更新监听（可选）。hermes_agent.prompt_versioning.PromptHotReloader
# 依赖 watchdog；未安装时核心版本管理/治理功能不受影响，仅热更新不可用。
# CI 默认 `uv sync --dev` 不装此 extra，避免引入重型文件系统监听依赖。
prompt-hotreload = [
    "watchdog>=3.0.0",
]
# ⚠️ 已废弃: 开发依赖统一收口到 [dependency-groups].dev（`uv sync --dev` 安装）。
# 此 extra 仅为兼容历史命令 `uv sync --extra dev`（如 .github/workflows/eval.yml）而保留，
# 内容与 dependency-group 保持一致；新增开发工具请只改 [dependency-groups].dev。
dev = [
    "ruff==0.15.16",
    "mypy>=1.10.0,<3",
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.26.0,<1.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6.0",
    "pytest-env>=1.1.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
# 单行最大长度为 120 (兼顾代码可读性和现代宽屏显示器)
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
# 启用 Pyflakes (F), pycodestyle (E, W) 和 isort (I 自动排序导入)
select = ["E", "F", "W", "I"]
# 忽略行长度检查 (E501)，因为项目中大量使用中文日志和注释
ignore = ["E501"]

[tool.ruff.format]
# 使用与 Black 一致的格式化风格
quote-style = "double"

[tool.pytest.ini_options]
# 仅主服务单测。data_subservice 依赖 tushare/futu/akshare 等重型 SDK，
# 按架构规定这些 SDK 禁止装在 backend 环境（backend/requirements.txt 明文禁止），
# 故子服务单测不放进本 testpaths，避免 collection 阶段 import 失败拖垮整轮。
# 子服务单测由 data_subservice/pytest.ini 独立驱动，需在装有对应 SDK 的环境运行。
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# -p no:unraisableexception: 禁用 pytest 的 unraisableexception 插件。
# 该插件会把 sys.unraisablehook 投递的异常（如 Python 3.13 下 unittest.mock 内部产生的
# "coroutine never awaited" 误报，见 backend/tests/conftest.py 顶部注释）强制升级为
# pytest.PytestUnraisableExceptionWarning 并当作测试失败；且插件在格式化报告时会触发
# tracemalloc_message 的二次导入崩溃（即 CI 日志里 "Exception ignored in sys.unraisablehook
# ... _pytest/tracemalloc.py" 噪声）。此类告警已被 conftest 认定为非业务 bug，故恢复 Python
# 默认（仅打印、不致命）行为。放到 addopts 对所有 pytest 调用（含本地）统一生效。
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-p no:unraisableexception",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "no_mock_external: skip _mock_external_services fixture in conftest.py",
    "asyncio: mark test as async",
]
asyncio_mode = "auto"
# pytest-env: 注入测试运行环境，避免 vectorbt/numba 在 workspace 内写缓存触发 IDE 的
# safe-delete 批量守卫导致 pytest 进程在 import 阶段 SystemExit 崩溃（见 backend/tests/conftest.py）。
# NUMBA_CACHE_DIR 指向 workspace 外，使 numba 缓存写入不进入守卫拦截范围。
env = [
    "NUMBA_CACHE_DIR=/tmp/numba_cache",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::RuntimeWarning",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/scripts/*",
    "*/migrations/*",
    "*/*.pb.py",
    "backend/main.py",
    # ── 类别 A：外部数据源 SDK 封装 / 桩 / 需外部依赖的代码 ──
    # 主服务经 DataSourceRouter 走 HTTP 代理，不本地直连；本机无 token/外部服务无法测。
    "backend/services/tushare/*",                 # Tushare A股 SDK 封装（CN 节点专属，需 TUSHARE_TOKEN）
    "backend/services/futu/mock_provider.py",     # 开发用 Mock 数据提供者
    "backend/core/embeddings.py",                 # 云端 Embedding Key 封装
    "backend/services/futu/ws_ingest.py",         # Finnhub WebSocket 长连接 ingest（需真实 WS）
    "backend/services/macro/rbi.py",              # RBI/WorldBank 远程兜底源（需外部 HTTP）
    "backend/services/finnhub/ws_ingest.py",      # Finnhub WS ingest
    # 定时 daemon 入口（纯 start/stop 调度，靠 e2e，单测价值低）
    "backend/services/market_review/scheduler.py",
    "backend/services/morning_briefing/scheduler.py",
    "backend/workers/macro/alert_daemon.py",
    "backend/workers/market/daemon.py",
    # 进程生命周期重型代码（启动序/信号量，单测价值低）
    "backend/bootstrap/lifecycle.py",
]
# 关键修复：pytest-cov 在 -n auto (xdist) 下会自动开启 parallel 模式并合并各 worker 的
# .coverage.<host>.<pid> 数据。此前误加的 concurrency=["multiprocessing"] 会破坏合并，
# 导致覆盖率被严重低估（CI 曾报 75% 而单进程/正确合并应为 ~83%）。仅保留 parallel 即可，
# 不可设置 concurrency=multiprocessing（该选项针对测试内 multiprocessing 子进程，与 xdist 冲突）。
parallel = true

[tool.coverage.report]
# ✅ push_handler 等低覆盖率文件单测已补充，覆盖率门槛提升至 80%
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
]

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
# 唯一权威的开发依赖组（`uv sync --dev` / `uv run` 默认安装此组）。
# ⚠️ 注意: [project.optional-dependencies].dev 是「extra」，只有显式 `--extra dev` 才装，
#    `--dev` 不会安装它。工具链（ruff/mypy/pre-commit）必须放在本组，
#    否则 pre-commit 只能靠 `uv run --with mypy` 临时解析，每次多付 ~3s 解析开销。
dev = [
    # ── 类型检查 / Lint / Hook 工具链 ──
    "ruff==0.15.16", # 锁定到 uv.lock 版本，避免解析到更新版导致格式检查漂移
    "mypy>=1.10.0,<3", # pre-commit mypy hook 依赖; 上界防 3.x 破坏性变更导致校验漂移
    "pre-commit>=3.6.0",
    # ── 测试 ──
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.26.0,<1.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6.0",
    "pytest-env>=1.1.0",
    "httpx>=0.27.0",
    "vcrpy>=8.3.0",
]

[tool.uv]
# mootdx 0.11.7 已停更且硬钉 httpx>=0.25.0,<0.26.0，与项目 httpx>=0.27.0 永久冲突。
# mootdx 仅用 httpx 下载 bestip 服务器列表（httpx.get，0.27 API 兼容），强制对齐项目版本。
override-dependencies = ["httpx>=0.27.0"]
