[project]
name = "quant-agent"
version = "0.1.0"
description = "Quant Agent - 资深量化交易架构师与自动化执行主脑"
requires-python = ">=3.11"
dependencies = [
    # Agent & LLM
    "openai>=1.14.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    # Quant & API (数据源 SDK 移到 optional-dependencies.datasource)
    "pandas>=2.0.0",
    "aiohttp>=3.9.0",
    "pyarrow>=15.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "pyrate-limiter>=3.0.0",
    "numba>=0.59.0",
    # Document Parsers
    "pdfplumber>=0.10.0",
    # API Backend
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "prometheus-client>=0.20.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.25",
    "greenlet>=3.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "bcrypt>=4.1.2",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "google-auth>=2.28.0",
    "requests>=2.31.0",
    # Search & NLP & Vector DB
    "duckduckgo-search>=5.0.0",
    "frozendict>=2.4.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "chromadb>=0.4.24",
    "langchain-text-splitters>=0.2.0",
    "pgvector>=0.4.2",
    "structlog>=26.1.0",
    "vectorbt>=0.28.2",
    # OpenTelemetry
    "opentelemetry-api>=1.0.0",
    "opentelemetry-sdk>=1.0.0",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-exporter-otlp-proto-http",
]

[project.optional-dependencies]
# 数据源 SDK（子服务节点安装，主节点走 HTTP 路由不安装）
datasource = [
    "websockets>=14.0",        # Finnhub WebSocket 客户端
    "finnhub-python>=2.5.0",   # Finnhub REST API (备用)
    "tushare>=1.4.0",
    "akshare>=1.1.15",
    "futu-api>=10.7.0",
]
# 本地向量化模型（可选，默认用 API 替代）
local-embedding = [
    "sentence-transformers>=2.5.0",
]
dev = [
    "ruff==0.15.16",  # 锁定到 uv.lock 中的版本，避免 uv run 解析到更新的 ruff 导致格式检查不一致
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
# 单行最大长度为 120 (兼顾代码可读性和现代宽屏显示器)
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
# 启用 Pyflakes (F), pycodestyle (E, W) 和 isort (I 自动排序导入)
select = ["E", "F", "W", "I"]
# 忽略行长度检查 (E501)，因为项目中大量使用中文日志和注释
ignore = ["E501"]

[tool.ruff.format]
# 使用与 Black 一致的格式化风格
quote-style = "double"

[tool.pytest.ini_options]
# 双目录: 主服务单测 + 数据子服务单测, 一并纳入 CI 验证闭环
testpaths = ["backend/tests", "data_subservice/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# -p no:unraisableexception: 禁用 pytest 的 unraisableexception 插件。
# 该插件会把 sys.unraisablehook 投递的异常（如 Python 3.13 下 unittest.mock 内部产生的
# "coroutine never awaited" 误报，见 backend/tests/conftest.py 顶部注释）强制升级为
# pytest.PytestUnraisableExceptionWarning 并当作测试失败；且插件在格式化报告时会触发
# tracemalloc_message 的二次导入崩溃（即 CI 日志里 "Exception ignored in sys.unraisablehook
# ... _pytest/tracemalloc.py" 噪声）。此类告警已被 conftest 认定为非业务 bug，故恢复 Python
# 默认（仅打印、不致命）行为。放到 addopts 对所有 pytest 调用（含本地）统一生效。
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-p no:unraisableexception",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "no_mock_external: skip _mock_external_services fixture in conftest.py",
    "asyncio: mark test as async",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::RuntimeWarning",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/scripts/*",
    "*/migrations/*",
    "*/*.pb.py",
    "backend/main.py",
]
# 关键修复：pytest-cov 在 -n auto (xdist) 下会自动开启 parallel 模式并合并各 worker 的
# .coverage.<host>.<pid> 数据。此前误加的 concurrency=["multiprocessing"] 会破坏合并，
# 导致覆盖率被严重低估（CI 曾报 75% 而单进程/正确合并应为 ~83%）。仅保留 parallel 即可，
# 不可设置 concurrency=multiprocessing（该选项针对测试内 multiprocessing 子进程，与 xdist 冲突）。
parallel = true

[tool.coverage.report]
# ✅ push_handler 等低覆盖率文件单测已补充，覆盖率门槛提升至 80%
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
]

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.26.0,<1.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6.0",
]
