# Pre-commit hooks 配置
# TEST-06: 提交即拦截，防止低质量代码流入主干
# 安装: pip install pre-commit && pre-commit install

repos:
  # ── Python: Ruff lint + format ────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16  # 与 pyproject ruff==0.15.16 及 uv.lock 对齐
    hooks:
      - id: ruff
        files: ^backend/.*\.py$
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        files: ^backend/.*\.py$

  # ── Python: 类型检查 (mypy) ───────────────────────────────────
  - repo: local
    hooks:
      - id: mypy
        name: Python Type Check
        # 用预装好的 .venv 直跑，不经 uv run：
        #   `uv run --with mypy` 每次都要为临时 overlay 重解析依赖 (~3s)。
        #   mypy 已收口到 [dependency-groups].dev，`uv sync --dev` 后即在 .venv 内。
        #   .venv 缺失时回退 uv run（此时不带 --with，走 lock 无解析开销）。
        entry: bash -c 'if [ -x .venv/bin/mypy ]; then M=.venv/bin/mypy; else M="uv run --frozen mypy"; fi; $M backend/core/ backend/routers/ --ignore-missing-imports --no-error-summary 2>&1 | head -30 || true'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

  # ── Python: 后端单元测试 ───────────────────────────────────────
  - repo: local
    hooks:
      - id: backend-tests
        name: Backend Tests
        # 同 mypy: 优先用 .venv 内解释器，避免 uv run 解析开销与系统 python 环境漂移。
        entry: bash -c 'if [ -x .venv/bin/python ]; then P=.venv/bin/python; else P=python; fi; $P -m pytest backend/tests/test_auth.py backend/tests/test_market.py backend/tests/test_tools.py -q --tb=short 2>&1 | tail -20'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

  # ── 前端: ESLint + Prettier ────────────────────────────────────
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend Lint
        entry: bash -c 'cd /Users/stephenhe/Development/workspace/quant_agent/frontend && pnpm run type-check 2>&1 | tail -10 || true'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

  # ── 前端: Vitest 单测 ──────────────────────────────────────────
  - repo: local
    hooks:
      - id: frontend-tests
        name: Frontend Tests
        entry: bash -c 'cd /Users/stephenhe/Development/workspace/quant_agent/frontend && pnpm run test --run 2>&1 | tail -20 || true'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

  # ── 通用检查 ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: detect-private-key
