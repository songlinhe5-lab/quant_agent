# ==========================================
# Quant Agent - 海外主节点配置 (Master Node)
# ==========================================
# 定位: 核心业务节点，承载所有业务功能
# 包含: Redis + PostgreSQL + quant-agent + quant-worker + 监控
# 数据源: Futu OpenD(宿主机) + YFinance(本地+远程切换) + AKShare(远程)
#
# 启动: docker-compose -f docker-compose.master.yml up -d
# 含监控: docker-compose -f docker-compose.master.yml --profile monitoring up -d
# ==========================================

# 显式项目名: 与 node 系列 compose 隔离，避免 up --remove-orphans 互相把对方服务当 orphan 清理。
# (历史坑: master/node 共用默认项目名 quant-agent，导致 node-s1 的 data-subservice 被 master 部署误判 orphan)
name: quant-agent-master

services:
  redis:
    image: redis:7-alpine
    container_name: quant_redis
    restart: always
    # 💡 SEC-14: Redis 仅绑定 Tailscale 内网 IP + loopback，不暴露公网。
    # 多绑定原因: TAILSCALE_IP 非空时会吞掉 127.0.0.1 回退 (见 postgres 段同款坑),
    # 导致 bridge 网络的 quant-worker 经 host.docker.internal 连不上 redis。
    # 公网 (38.60.126.42) 不绑定,保持 SEC-14 红线。
    ports:
      - "127.0.0.1:6379:6379"
      - "${TAILSCALE_IP:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-quant_redis_secret_2026}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-quant_redis_secret_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    networks:
      - quant-internal

  postgres:
    image: pgvector/pgvector:pg15
    container_name: quant_postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-quant_admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-quant_pg_secret_2026}
      - POSTGRES_DB=${DB_NAME:-quant_agent_db}
    # 💡 SEC-15: PostgreSQL 不暴露公网端口。
    # 仅绑定 loopback 与 Tailscale 内网，公网 (38.60.126.42) 不可达。
    ports:
      - "127.0.0.1:5432:5432"
      - "${TAILSCALE_IP:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-quant_admin} -d ${DB_NAME:-quant_agent_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    networks:
      - quant-internal

  quant-agent:
    image: ghcr.io/songlinhe5-lab/quant-agent:latest
    pull_policy: missing
    container_name: quant_app
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 1 --loop uvloop --http httptools --timeout-keep-alive 65 --limit-concurrency 5000 --no-access-log
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # 💡 SEC-16: 不使用 host 网络模式，避免共享宿主网络栈暴露所有端口。
    # 改用 bridge 网络 + 端口映射。
    # 8000 端口需对公网开放（frontend 经 Cloudflare Pages 回调），
    # 同时绑定 127.0.0.1 供本机 / Tailscale 内网访问。
    ports:
      - "0.0.0.0:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - QUANT_ENV=production
      - OTEL_ENABLED=false
      - DATABASE_URL=postgresql://${DB_USER:-quant_admin}:${DB_PASSWORD:-quant_pg_secret_2026}@host.docker.internal:5432/${DB_NAME:-quant_agent_db}
      - DATA_SOURCE_ROUTER_ENABLED=true
      # 数据子服务固定运行于 8001 端口，使用独立 .env.data-node 配置（与主服务 .env 隔离）。
      # 主服务部署时仅需在主 .env 中填入子服务内网 IP（DS_NODE_IP，同机填 127.0.0.1），
      # 以下变量由 compose 从 .env 读取 DS_NODE_IP 自动展开，无需手动硬编码。
      # bridge 模式下经 host.docker.internal 访问宿主上运行的子服务
      - YF_PRIMARY_NODE_URL=http://host.docker.internal:8001
      - YF_BACKUP_NODE_URL=http://${VPS_S2_TAILSCALE_IP:-s3}:8001,http://${VPS_S3_TAILSCALE_IP:-s4}:8001,http://${VPS_S4_TAILSCALE_IP:-s2}:8001
      - TUSHARE_REMOTE_URL=http://${VPS_BJ_TAILSCALE_IP:-bj}:8001
      - AKSHARE_REMOTE_URL=http://${VPS_BJ_TAILSCALE_IP:-bj}:8001
      # bridge 模式下经 host.docker.internal 访问宿主 loopback 上的 OpenD
      - FUTU_HOST=host.docker.internal
      - FUTU_PORT=11111
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - quant_db:/app/backend/data
      - ./reports:/app/reports
    networks:
      - quant-internal
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G

  quant-worker:
    image: ghcr.io/songlinhe5-lab/quant-agent:latest
    pull_policy: missing
    container_name: quant_worker
    command: python backend/worker.py
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # 💡 SEC-16: 不使用 host 网络模式，避免共享宿主网络栈暴露所有端口。
    # 改用 bridge 网络，经 host.docker.internal 访问宿主服务。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - QUANT_ENV=production
      - OTEL_ENABLED=false
      # bridge 模式下经 host.docker.internal 访问宿主 loopback 上的 OpenD
      - FUTU_HOST=host.docker.internal
      - DATABASE_URL=postgresql://${DB_USER:-quant_admin}:${DB_PASSWORD:-quant_pg_secret_2026}@host.docker.internal:5432/${DB_NAME:-quant_agent_db}
    volumes:
      - quant_db:/app/backend/data
    networks:
      - quant-internal
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M

  # 💡 SEC-17: 私有镜像中转 Registry，仅绑定 loopback + Tailscale 内网，不暴露公网。
  # 用途: 北京等国内节点经 Tailscale 内网拉取镜像，避免跨洋直连 GHCR 龟速。
  # 绑定 127.0.0.1 (CI push) + TAILSCALE_IP (bj 节点 pull)。Tailscale 网络本身是隔离的 tailnet。
  registry:
    image: registry:2
    container_name: quant_registry
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
      - "${TAILSCALE_IP:-127.0.0.1}:5000:5000"
    # SEC-17: 内网私有 registry, 仅 bind 到 loopback + Tailscale 内网 IP (不暴露公网)。
    # 同 tailnet 即视为可信, 挂载 config 完全不配置 auth 中间件 (registry:2 无 auth 时匿名 push/pull 均放行),
    # 免去 htpasswd / token issuer 运维负担。安全边界由网络层 (仅 loopback + TS IP) 保证。
    # 北京节点 docker daemon 需将 ${TAILSCALE_IP}:5000 加入 insecure-registries (HTTP 拉取)。
    command: ["serve", "/etc/registry/config.yml"]
    volumes:
      - registry_data:/var/lib/registry
      - ./registry-config.yml:/etc/registry/config.yml:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    networks:
      - quant-internal

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: quant_prometheus
    restart: always
    profiles: [monitoring]
  # 💡 OPS-02: Prometheus 仅 Tailscale 内网访问，不对公网暴露
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # 💡 多副本切换 Prometheus recording rules 时用：取消下行注释即可挂载 rules 目录，
      # 并同步取消 prometheus.yml 的 rule_files 注释（详见 config/prometheus_rules.yml 头部双向切换清单）。
      # - ./config/prometheus_rules.yml:/etc/prometheus/rules/fmp_watchlist.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - quant-internal

  grafana:
    image: grafana/grafana:9.5.3
    container_name: quant_grafana
    restart: always
    profiles: [monitoring]
  # 💡 OPS-02: Grafana 仅 Tailscale 内网访问，不对公网暴露
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    networks:
      - quant-internal

networks:
  quant-internal:
    driver: bridge

volumes:
  redis_data:
    name: quant_master_redis_data
  quant_db:
    name: quant_master_db
  postgres_data:
    name: quant_master_postgres_data
  prometheus_data:
    name: quant_master_prometheus_data
  grafana_data:
    name: quant_master_grafana_data
  registry_data:
    name: quant_master_registry_data
