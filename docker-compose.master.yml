# ==========================================
# Quant Agent - 海外主节点配置 (Master Node)
# ==========================================
# 定位: 核心业务节点，承载所有业务功能
# 包含: Redis + PostgreSQL + quant-agent + quant-worker + 监控
# 数据源: Futu OpenD(宿主机) + YFinance(本地+远程切换) + AKShare(远程)
#
# 启动: docker-compose -f docker-compose.master.yml up -d
# 含监控: docker-compose -f docker-compose.master.yml --profile monitoring up -d
# ==========================================

services:
  redis:
    image: redis:7-alpine
    container_name: quant_redis
    restart: always
    # 💡 SEC-14: Redis 仅绑定 Tailscale 内网 IP + loopback，不暴露公网。
    # 双绑定原因: TAILSCALE_IP 非空时会吞掉 127.0.0.1 回退 (见 postgres 段同款坑),
    # 导致 host 网络模式的 quant-worker 经 127.0.0.1 连不上 redis。
    # 公网 (38.60.126.42) 不绑定,保持 SEC-14 红线。
    ports:
      - "127.0.0.1:6379:6379"
      - "${TAILSCALE_IP:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-quant_redis_secret_2026}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-quant_redis_secret_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    networks:
      - quant-internal

  postgres:
    image: pgvector/pgvector:pg15
    container_name: quant_postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-quant_admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-quant_pg_secret_2026}
      - POSTGRES_DB=${DB_NAME:-quant_agent_db}
    # 💡 SEC-15: PostgreSQL 不暴露公网端口。
    # 仅绑定 Tailscale 私有网 (100.102.223.44) 与 loopback，供 host 网络模式的
    # quant-worker 经 127.0.0.1/100.102.223.44 访问；公网 (38.60.126.42) 不可达。
    ports:
      - "127.0.0.1:5432:5432"
      - "100.102.223.44:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-quant_admin} -d ${DB_NAME:-quant_agent_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    networks:
      - quant-internal

  quant-agent:
    image: ghcr.io/songlinhe5-lab/quant-agent:latest
    pull_policy: missing
    container_name: quant_app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 1 --loop uvloop --http httptools --timeout-keep-alive 65 --limit-concurrency 5000 --no-access-log
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # host 网络模式:容器共享宿主网络栈,容器内 127.0.0.1 = 宿主,
    # 直接 loopback 连 OpenD (127.0.0.1:11111),无需中转/不破 SEC-15。
    # 与 quant-worker 一致,避免 bridge 内 127.0.0.1 指向容器自身导致 OpenD 不可达。
    network_mode: host
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - QUANT_ENV=production
      - OTEL_ENABLED=false
      - DATABASE_URL=postgresql://${DB_USER:-quant_admin}:${DB_PASSWORD:-quant_pg_secret_2026}@127.0.0.1:5432/${DB_NAME:-quant_agent_db}
      - DATA_SOURCE_ROUTER_ENABLED=true
      # host 模式下 127.0.0.1 即宿主 loopback,直连 OpenD
      - FUTU_HOST=127.0.0.1
      - FUTU_PORT=11111
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - quant_db:/app/backend/data
      - ./reports:/app/reports
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G

  quant-worker:
    image: ghcr.io/songlinhe5-lab/quant-agent:latest
    pull_policy: missing
    container_name: quant_worker
    command: python backend/worker.py
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # host 网络模式:容器共享宿主网络栈,容器内 127.0.0.1 = 宿主,
    # 直接 loopback 连 OpenD (127.0.0.1:11111),无需中转/不破 SEC-15。
    network_mode: host
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - QUANT_ENV=production
      - OTEL_ENABLED=false
      # host 模式下 127.0.0.1 即宿主 loopback,直连 OpenD
      - FUTU_HOST=127.0.0.1
      - DATABASE_URL=postgresql://${DB_USER:-quant_admin}:${DB_PASSWORD:-quant_pg_secret_2026}@127.0.0.1:5432/${DB_NAME:-quant_agent_db}
    volumes:
      - quant_db:/app/backend/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M

  # 私有镜像中转 Registry (本机 localhost + Tailscale 内网双绑定)
  # 用途: 北京等国内节点经内网拉取镜像，避免跨洋直连 GHCR 龟速
  # 双绑定原因:
  #   - 127.0.0.1:5000  → 供本机 CI 脚本 `docker push localhost:5000/...` 使用
  #                       (backend.yml push 段硬编码 localhost，不感知远程 TS IP)
  #   - ${TAILSCALE_IP}:5000 → 供北京节点经 Tailscale 内网高速拉取
  # 若仅绑 ${TAILSCALE_IP}，TAILSCALE_IP 非空时 127.0.0.1 回退被吞，
  #   导致本机 push 报 connection refused（PR 失败根因）。
  registry:
    image: registry:2
    container_name: quant_registry
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
      - "${TAILSCALE_IP:-127.0.0.1}:5000:5000"
    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    volumes:
      - registry_data:/var/lib/registry
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    networks:
      - quant-internal

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: quant_prometheus
    restart: always
    profiles: [monitoring]
  # 💡 OPS-02: Prometheus 仅 Tailscale 内网访问，不对公网暴露
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # 💡 多副本切换 Prometheus recording rules 时用：取消下行注释即可挂载 rules 目录，
      # 并同步取消 prometheus.yml 的 rule_files 注释（详见 config/prometheus_rules.yml 头部双向切换清单）。
      # - ./config/prometheus_rules.yml:/etc/prometheus/rules/fmp_watchlist.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - quant-internal

  grafana:
    image: grafana/grafana:9.5.3
    container_name: quant_grafana
    restart: always
    profiles: [monitoring]
  # 💡 OPS-02: Grafana 仅 Tailscale 内网访问，不对公网暴露
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    networks:
      - quant-internal

networks:
  quant-internal:
    driver: bridge

volumes:
  redis_data:
    name: quant_master_redis_data
  quant_db:
    name: quant_master_db
  postgres_data:
    name: quant_master_postgres_data
  prometheus_data:
    name: quant_master_prometheus_data
  grafana_data:
    name: quant_master_grafana_data
  registry_data:
    name: quant_master_registry_data
